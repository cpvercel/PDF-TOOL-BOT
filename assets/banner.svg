<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#101936"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>

    <!-- Main cyan/violet gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="75%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Violet gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- PDF red -->
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d67"/>
      <stop offset="100%" stop-color="#b91c3c"/>
    </linearGradient>

    <!-- Paper -->
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe4f0"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#38bdf8"
            stroke-width="0.5"
            opacity="0.10"/>
      <circle cx="20" cy="20" r="1"
              fill="#a78bfa"
              opacity="0.18"/>
    </pattern>

    <style>

      @keyframes float1 {
        0%,100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(-12px) rotate(-2deg); }
      }

      @keyframes float2 {
        0%,100% { transform: translateY(0) rotate(4deg); }
        50% { transform: translateY(-9px) rotate(7deg); }
      }

      @keyframes glowPulse {
        0%,100% { opacity: .65; }
        50% { opacity: 1; }
      }

      @keyframes shimmer {
        0% { opacity: .75; }
        50% { opacity: 1; }
        100% { opacity: .75; }
      }

      @keyframes drift {
        0%,100% { transform: translateX(0); }
        50% { transform: translateX(5px); }
      }

      .doc1 {
        animation: float1 4s ease-in-out infinite;
        transform-origin: center;
      }

      .doc2 {
        animation: float2 5s ease-in-out infinite;
        transform-origin: center;
      }

      .glow {
        animation: glowPulse 3s ease-in-out infinite;
      }

      .title {
        animation: shimmer 3s ease-in-out infinite;
      }

      .badges {
        animation: drift 6s ease-in-out infinite;
      }

    </style>
  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- Large decorative circles -->
  <circle cx="90" cy="70" r="90"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1"
          opacity=".12"/>

  <circle cx="90" cy="70" r="65"
          fill="none"
          stroke="#a78bfa"
          stroke-width="1"
          opacity=".10"/>

  <circle cx="1110" cy="275" r="95"
          fill="none"
          stroke="#22d3ee"
          stroke-width="1"
          opacity=".12"/>

  <circle cx="1110" cy="275" r="65"
          fill="none"
          stroke="#8b5cf6"
          stroke-width="1"
          opacity=".10"/>


  <!-- Glowing decorative orbs -->

  <circle cx="235" cy="45" r="35"
          fill="#38bdf8"
          opacity=".08"
          filter="url(#softGlow)"/>

  <circle cx="980" cy="290" r="40"
          fill="#8b5cf6"
          opacity=".09"
          filter="url(#softGlow)"/>


  <!-- Top border -->
  <rect x="0" y="0"
        width="1200"
        height="4"
        fill="url(#mainGrad)"
        filter="url(#glow)"/>

  <!-- Bottom border -->
  <rect x="0" y="336"
        width="1200"
        height="4"
        fill="url(#mainGrad)"
        filter="url(#glow)"/>


  <!-- ================= LEFT BACK DOCUMENT ================= -->

  <g class="doc2" transform="translate(110 48)">

    <rect x="8" y="5"
          width="105"
          height="135"
          rx="7"
          fill="#000"
          opacity=".35"/>

    <rect x="0" y="0"
          width="105"
          height="135"
          rx="7"
          fill="#1e293b"
          stroke="#38bdf8"
          stroke-width="1"
          opacity=".85"/>

    <!-- Fold -->
    <polygon points="80,0 105,25 80,25"
             fill="#334155"/>

    <!-- Lines -->
    <line x1="16" y1="48" x2="87" y2="48"
          stroke="#64748b" stroke-width="2"/>

    <line x1="16" y1="62" x2="87" y2="62"
          stroke="#64748b" stroke-width="2"/>

    <line x1="16" y1="76" x2="70" y2="76"
          stroke="#64748b" stroke-width="2"/>

  </g>


  <!-- ================= MAIN PDF DOCUMENT ================= -->

  <g class="doc1" transform="translate(65 62)">

    <!-- Shadow -->
    <rect x="8" y="9"
          width="125"
          height="160"
          rx="7"
          fill="#000"
          opacity=".5"/>

    <!-- Paper -->
    <rect x="0" y="0"
          width="125"
          height="160"
          rx="7"
          fill="url(#paper)"/>

    <!-- Paper border -->
    <rect x="6" y="6"
          width="113"
          height="148"
          rx="4"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1"
          opacity=".55"/>

    <!-- Corner fold -->
    <polygon points="93,0 125,32 93,32"
             fill="#cbd5e1"/>

    <polygon points="93,0 125,32 125,0"
             fill="#f8fafc"/>


    <!-- PDF badge -->
    <rect x="0" y="30"
          width="67"
          height="32"
          rx="6"
          fill="url(#pdfGrad)"
          filter="url(#glow)"/>

    <text x="34"
          y="52"
          font-family="Arial Black, Arial"
          font-size="16"
          font-weight="900"
          fill="#ffffff"
          text-anchor="middle"
          letter-spacing="1">
      PDF
    </text>


    <!-- Document lines -->

    <line x1="13" y1="78"
          x2="111" y2="78"
          stroke="#94a3b8"
          stroke-width="2"/>

    <line x1="13" y1="91"
          x2="111" y2="91"
          stroke="#94a3b8"
          stroke-width="2"/>

    <line x1="13" y1="104"
          x2="92" y2="104"
          stroke="#94a3b8"
          stroke-width="2"/>

    <line x1="13" y1="117"
          x2="104" y2="117"
          stroke="#94a3b8"
          stroke-width="1.5"/>

    <line x1="13" y1="130"
          x2="82" y2="130"
          stroke="#94a3b8"
          stroke-width="1.5"/>

    <line x1="13" y1="143"
          x2="98" y2="143"
          stroke="#94a3b8"
          stroke-width="1.5"/>

  </g>


  <!-- ================= CENTER TITLE ================= -->

  <text x="625"
        y="122"
        font-family="Georgia, Times New Roman, serif"
        font-size="61"
        font-weight="700"
        letter-spacing="4"
        text-anchor="middle"
        fill="url(#mainGrad)"
        class="title"
        filter="url(#glow)">
    PDF TOOL BOT
  </text>


  <!-- Decorative divider -->

  <line x1="365"
        y1="142"
        x2="885"
        y2="142"
        stroke="url(#mainGrad)"
        stroke-width="2"
        opacity=".8"/>

  <circle cx="365" cy="142"
          r="3"
          fill="#38bdf8"/>

  <circle cx="885" cy="142"
          r="3"
          fill="#a78bfa"/>


  <!-- Subtitle -->

  <text x="625"
        y="176"
        font-family="Georgia, serif"
        font-size="18"
        font-style="italic"
        fill="#a8b4c8"
        text-anchor="middle">
    The Ultimate Telegram Document Engineering Suite
  </text>


  <!-- ================= BADGES ================= -->

  <g class="badges">

    <!-- Badge 1 -->
    <rect x="340" y="200"
          width="165"
          height="36"
          rx="18"
          fill="#111a31"
          stroke="#38bdf8"
          stroke-width="1.3"/>

    <circle cx="360" cy="218"
            r="4"
            fill="#38bdf8"
            class="glow"/>

    <text x="426"
          y="223"
          font-family="Arial, sans-serif"
          font-size="13"
          font-weight="600"
          fill="#d7f3ff"
          text-anchor="middle">
      44+ Operations
    </text>


    <!-- Badge 2 -->
    <rect x="520" y="200"
          width="150"
          height="36"
          rx="18"
          fill="#17152f"
          stroke="#a78bfa"
          stroke-width="1.3"/>

    <circle cx="540" cy="218"
            r="4"
            fill="#a78bfa"
            class="glow"/>

    <text x="600"
          y="223"
          font-family="Arial, sans-serif"
          font-size="13"
          font-weight="600"
          fill="#eee9ff"
          text-anchor="middle">
      Tesseract OCR
    </text>


    <!-- Badge 3 -->
    <rect x="685" y="200"
          width="155"
          height="36"
          rx="18"
          fill="#101f31"
          stroke="#22d3ee"
          stroke-width="1.3"/>

    <circle cx="705" cy="218"
            r="4"
            fill="#22d3ee"
            class="glow"/>

    <text x="765"
          y="223"
          font-family="Arial, sans-serif"
          font-size="13"
          font-weight="600"
          fill="#d9fbff"
          text-anchor="middle">
      17 Languages
    </text>


    <!-- Badge 4 -->
    <rect x="855" y="200"
          width="145"
          height="36"
          rx="18"
          fill="#1d1830"
          stroke="#818cf8"
          stroke-width="1.3"/>

    <circle cx="875" cy="218"
            r="4"
            fill="#818cf8"
            class="glow"/>

    <text x="930"
          y="223"
          font-family="Arial, sans-serif"
          font-size="12"
          font-weight="600"
          fill="#e7e7ff"
          text-anchor="middle">
      Async + MongoDB
    </text>

  </g>


  <!-- ================= TECH STACK ================= -->

  <text x="625"
        y="276"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#718096"
        text-anchor="middle"
        letter-spacing="2">
    Python 3.11  ·  PyMuPDF  ·  Kurigram  ·  Ghostscript  ·  LibreOffice
  </text>


  <!-- ================= RIGHT MINI DOCUMENT ================= -->

  <g class="doc2" transform="translate(1025 82)">

    <rect x="0" y="0"
          width="88"
          height="115"
          rx="6"
          fill="#111827"
          stroke="#22d3ee"
          stroke-width="1"
          opacity=".8"/>

    <polygon points="67,0 88,21 67,21"
             fill="#334155"/>

    <rect x="0" y="21"
          width="44"
          height="23"
          rx="4"
          fill="url(#pdfGrad)"
          opacity=".9"/>

    <text x="22"
          y="37"
          font-family="Arial Black, Arial"
          font-size="11"
          font-weight="900"
          fill="#fff"
          text-anchor="middle">
      PDF
    </text>

    <line x1="9" y1="56"
          x2="79" y2="56"
          stroke="#38bdf8"
          stroke-width="1"
          opacity=".5"/>

    <line x1="9" y1="68"
          x2="79" y2="68"
          stroke="#a78bfa"
          stroke-width="1"
          opacity=".5"/>

    <line x1="9" y1="80"
          x2="65" y2="80"
          stroke="#22d3ee"
          stroke-width="1"
          opacity=".5"/>

    <line x1="9" y1="92"
          x2="73" y2="92"
          stroke="#818cf8"
          stroke-width="1"
          opacity=".5"/>

  </g>


  <!-- ================= CORNER DECORATIONS ================= -->

  <g fill="none"
     stroke="url(#mainGrad)"
     stroke-width="1.2"
     opacity=".55">

    <!-- Top left -->
    <polyline points="18,18 18,45 45,45"/>
    <polyline points="18,18 45,18"/>

    <!-- Top right -->
    <polyline points="1182,18 1182,45 1155,45"/>
    <polyline points="1182,18 1155,18"/>

    <!-- Bottom left -->
    <polyline points="18,322 18,295 45,295"/>
    <polyline points="18,322 45,322"/>

    <!-- Bottom right -->
    <polyline points="1182,322 1182,295 1155,295"/>
    <polyline points="1182,322 1155,322"/>

  </g>


  <!-- Small decorative diamonds -->

  <g fill="url(#mainGrad)" opacity=".6">

    <rect x="290" y="95"
          width="7" height="7"
          transform="rotate(45 293.5 98)"/>

    <rect x="940" y="95"
          width="7" height="7"
          transform="rotate(45 943.5 98)"/>

    <rect x="300" y="250"
          width="5" height="5"
          transform="rotate(45 302.5 252.5)"/>

    <rect x="960" y="250"
          width="5" height="5"
          transform="rotate(45 962.5 252.5)"/>

  </g>

</svg>
